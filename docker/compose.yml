# 開発コンテナ。host の repo を /workspace にマウント。
# Apple Silicon でも asm 差異を出さないため amd64 を強制する。
# 起動: docker compose -f docker/compose.yml run --rm dev
services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: c-game-deepdive:latest
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - ..:/workspace
    stdin_open: true
    tty: true
    # gdb / strace / perf に必要な権限。学習用なのでフル昇格 (本番では絞ること)。
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      - TERM=xterm-256color
    command: /bin/bash
